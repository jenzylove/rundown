[project]
name = "rundown"
version = "0.1.0"
description = "Autonomous half-time studio producer for synthetic football matches"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "jsonschema>=4.23"]
agents = [
  "agent-framework-core>=1.22",
  "agent-framework-openai>=1.17",  # versions are not in step with core
  "agent-framework-foundry>=1.15",
  "azure-cognitiveservices-speech>=1.52",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "azure-identity>=1.19",
  "azure-monitor-opentelemetry>=1.8.10,<2",
]
azure = [  # the match stream and the archive (api/bus.py, api/archive.py)
  "azure-eventhub>=5.15",
  "azure-cosmos>=4.9",
  "aiohttp>=3.9",  # Event Hubs over 443 (EVENTHUB_TRANSPORT=websocket), for networks that only allow HTTPS
]

[project.scripts]
rundown-sim = "rundown.sim.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rundown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
