[project]
name = "rundown"
version = "0.1.0"
description = "Autonomous half-time studio producer for synthetic football matches"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
agents = [
  "agent-framework-core>=1.22",
  "agent-framework-openai>=1.22",
  "azure-cognitiveservices-speech>=1.52",
  "jsonschema>=4.23",
  "pydantic>=2.9",
]

[project.scripts]
rundown-sim = "rundown.sim.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rundown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
